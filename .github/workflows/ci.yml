name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: CI only needs to read the repository.
permissions:
  contents: read

# Cancel superseded runs on the same ref (e.g. rapid pushes or Dependabot rebases).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  documentation:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: wiki/requirements.txt

      - name: Check documentation links and contracts
        run: python scripts/check_docs.py

      - name: Install documentation dependencies
        run: pip install -r wiki/requirements.txt

      - name: Build documentation
        run: mkdocs build --strict

  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify Linux binary runtime wheels
        run: |
          mkdir -p ../dist/runtime-wheels
          pip download \
            --only-binary=:all: \
            --dest ../dist/runtime-wheels \
            --requirement requirements-runtime.txt

      - name: Lint (ruff)
        if: matrix.python-version == '3.12'
        run: ruff check .

      - name: Tests (pytest)
        run: pytest -q

      # Dependency vulnerability scan (see SECURITY.md release hygiene)
      - name: Audit dependencies (pip-audit)
        if: matrix.python-version == '3.12'
        run: |
          pip install pip-audit
          pip-audit --skip-editable

  frontend:
    name: Frontend (lint + unit + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Dependency vulnerability scan (see SECURITY.md release hygiene)
      - name: Audit dependencies (npm audit)
        run: npm audit --audit-level=high

      - name: Lint (eslint)
        run: npm run lint

      - name: Unit tests (vitest)
        run: npm run test:run

      - name: Build
        run: npm run build

      - name: Verify demo code is absent from production build
        run: |
          if grep -R "LICENSETRACK_DEMO_MARKER" dist; then
            echo "Demo marker leaked into the production build."
            exit 1
          fi

      - name: Validate native installer shell entrypoints
        shell: bash
        run: |
          for entrypoint in \
            ../install.sh \
            ../upgrade.sh \
            ../packaging/native/install.sh \
            ../packaging/native/upgrade.sh \
            ../packaging/native/libexec/select_python.sh \
            ../scripts/test_native_bundle_structure.sh \
            ../scripts/test_native_runtime.sh \
            ../scripts/test_native_python_selector.sh
          do
            bash -n "$entrypoint"
          done

      - name: Build native release archive
        run: python ../scripts/build_native_release.py --skip-frontend-build --output-dir ../dist/native-test

      - name: Verify native bundle structure
        shell: bash
        run: PYTHON_BIN="$(command -v python)" bash ../scripts/test_native_bundle_structure.sh ../dist/native-test

  e2e:
    name: Frontend e2e (Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run e2e tests
        run: npm run test:e2e

  demo-e2e:
    name: Demo showcase e2e (Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run demo golden path
        run: npm run test:e2e:demo
