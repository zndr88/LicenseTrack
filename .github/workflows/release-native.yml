name: Native Linux Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-native-release:
    name: Native Linux x86_64 bundle
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-runtime.txt

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Verify tag matches application version
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import re

          content = Path("backend/app/version.py").read_text(encoding="utf-8")
          version = re.search(r'APP_VERSION\s*=\s*["\x27]([^"\x27]+)', content).group(1)
          tag = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          if version != tag:
              raise SystemExit(f"Tag v{tag} does not match APP_VERSION {version}")
          PY

      - name: Validate shell entrypoints
        run: bash -n install.sh upgrade.sh packaging/native/install.sh packaging/native/upgrade.sh

      - name: Build native archive and offline wheelhouse
        run: python scripts/build_native_release.py --download-wheels

      - name: Smoke-test packaged runtime
        shell: bash
        run: |
          mkdir native-smoke
          tar -xzf dist/native/*.tar.gz -C native-smoke
          bundle_dir=$(find native-smoke -mindepth 1 -maxdepth 1 -type d -name 'licensetrack-native-*' -print -quit)
          bash scripts/test_native_runtime.sh "$bundle_dir"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: licensetrack-native-${{ github.ref_name }}-linux-x86_64
          path: |
            dist/native/*.tar.gz
            dist/native/*.zip
            dist/native/SHA256SUMS
          if-no-files-found: error

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/native/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/native/* --generate-notes --verify-tag
          fi
