name: Native Linux Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  actions: read
  contents: read

concurrency:
  group: native-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-release:
    name: Validate native release tag
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify tag matches application version
        if: github.event_name == 'push'
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import re

          content = Path("backend/app/version.py").read_text(encoding="utf-8")
          version = re.search(r'APP_VERSION\s*=\s*["\x27]([^"\x27]+)', content).group(1)
          tag = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          if version != tag:
              raise SystemExit(f"Tag v{tag} does not match APP_VERSION {version}")
          PY

      - name: Validate shell entrypoints
        shell: bash
        run: |
          for entrypoint in \
            install.sh \
            upgrade.sh \
            packaging/native/install.sh \
            packaging/native/upgrade.sh \
            packaging/native/libexec/select_python.sh \
            scripts/test_native_bundle_structure.sh \
            scripts/test_native_permissions.sh \
            scripts/test_native_runtime.sh \
            scripts/test_native_python_selector.sh
          do
            bash -n "$entrypoint"
          done

  build-wheelhouse:
    name: Build ${{ matrix.abi }} wheelhouse
    needs: validate-release
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.12"
            abi: cp312
          - python-version: "3.13"
            abi: cp313
          - python-version: "3.14"
            abi: cp314
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements-runtime.txt

      - name: Download binary runtime wheels
        shell: bash
        run: |
          wheelhouse="dist/prepared-wheelhouses/${{ matrix.abi }}"
          mkdir -p "$wheelhouse"
          python -m pip download \
            --only-binary=:all: \
            --dest "$wheelhouse" \
            --requirement backend/requirements-runtime.txt

      - name: Validate wheelhouse and interpreter ABI
        env:
          EXPECTED_ABI: ${{ matrix.abi }}
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          from scripts.build_native_release import current_python_abi, validate_wheelhouse

          expected_abi = os.environ["EXPECTED_ABI"]
          actual_abi = current_python_abi()
          if actual_abi != expected_abi:
              raise SystemExit(f"Expected {expected_abi}, selected {actual_abi}")
          validate_wheelhouse(expected_abi, Path("dist/prepared-wheelhouses") / expected_abi)
          PY

      - name: Upload wheelhouse artifact
        uses: actions/upload-artifact@v7
        with:
          name: native-wheelhouse-${{ matrix.abi }}
          path: dist/prepared-wheelhouses/${{ matrix.abi }}
          if-no-files-found: error
          retention-days: 2

  assemble-candidate:
    name: Assemble combined native candidate
    needs: build-wheelhouse
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Download cp312 wheelhouse
        uses: actions/download-artifact@v8
        with:
          name: native-wheelhouse-cp312
          path: dist/prepared-wheelhouses/cp312

      - name: Download cp313 wheelhouse
        uses: actions/download-artifact@v8
        with:
          name: native-wheelhouse-cp313
          path: dist/prepared-wheelhouses/cp313

      - name: Download cp314 wheelhouse
        uses: actions/download-artifact@v8
        with:
          name: native-wheelhouse-cp314
          path: dist/prepared-wheelhouses/cp314

      - name: Build frontend and combined native archives
        shell: bash
        run: |
          python scripts/build_native_release.py \
            --require-all-python-abis \
            --wheelhouse cp312=dist/prepared-wheelhouses/cp312 \
            --wheelhouse cp313=dist/prepared-wheelhouses/cp313 \
            --wheelhouse cp314=dist/prepared-wheelhouses/cp314

      - name: Verify candidate checksums and archive structure
        shell: bash
        run: PYTHON_BIN="$(command -v python)" bash scripts/test_native_bundle_structure.sh dist/native

      - name: Upload native candidate
        uses: actions/upload-artifact@v7
        with:
          name: licensetrack-native-candidate
          path: |
            dist/native/*.tar.gz
            dist/native/*.zip
            dist/native/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  smoke-candidate:
    name: Smoke candidate on Python ${{ matrix.python-version }}
    needs: assemble-candidate
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.12"
            abi: cp312
          - python-version: "3.13"
            abi: cp313
          - python-version: "3.14"
            abi: cp314
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download assembled candidate
        uses: actions/download-artifact@v8
        with:
          name: licensetrack-native-candidate
          path: dist/native

      - name: Verify and extract candidate
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          tarballs=(dist/native/*.tar.gz)
          if [[ ${#tarballs[@]} -ne 1 ]]; then
            echo "Expected exactly one native tar archive." >&2
            exit 1
          fi
          (cd dist/native && sha256sum --check SHA256SUMS)
          mkdir native-smoke
          tar -xzf "${tarballs[0]}" -C native-smoke

      - name: Smoke-test packaged runtime
        env:
          LT_NATIVE_EXPECTED_PYTHON_ABI: ${{ matrix.abi }}
        shell: bash
        run: |
          bundle_dir=$(find native-smoke -mindepth 1 -maxdepth 1 -type d -name 'licensetrack-native-*' -print -quit)
          if [[ -z "$bundle_dir" ]]; then
            echo "Extracted native bundle was not found." >&2
            exit 1
          fi
          PYTHON_BIN="$(command -v python)" bash scripts/test_native_runtime.sh "$bundle_dir"

  publish-release:
    name: Publish tested native release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs:
      - validate-release
      - assemble-candidate
      - smoke-candidate
    runs-on: ubuntu-22.04
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download tested candidate
        uses: actions/download-artifact@v8
        with:
          name: licensetrack-native-candidate
          path: dist/native

      - name: Verify tested candidate checksums
        run: (cd dist/native && sha256sum --check SHA256SUMS)

      - name: Create or update GitHub release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/native/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/native/* --generate-notes --verify-tag
          fi
