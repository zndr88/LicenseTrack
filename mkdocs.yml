site_name: LicenseTrack Documentation
site_description: Self-hosted software license procurement and lifecycle management
site_url: https://zndr88.github.io/LicenseTrack/docs/
repo_url: https://github.com/zndr88/LicenseTrack
repo_name: zndr88/LicenseTrack
edit_uri: edit/main/wiki/

docs_dir: wiki

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - content.code.copy
    - toc.follow
    - search.suggest
    - search.highlight

nav:
  - Home: index.md
  - Getting Started:
      - Prerequisites: getting-started/prerequisites.md
      - Installation: getting-started/installation.md
      - Native Linux Installation: getting-started/native-installation.md
      - First Launch & Login: getting-started/first-login.md
  - Core Workflows:
      - Importing Licenses: first-licenses/importing.md
      - Understanding the License Record: first-licenses/license-record.md
      - Managing Licenses and Maintenance: first-licenses/managing-licenses.md
      - Renewal & Lifecycle: first-licenses/renewal-lifecycle.md
      - Procurement from Sourcing to License: workflows/procurement.md
      - Contracts and Documents: workflows/contracts-documents.md
      - Reports and Calculations: workflows/reports.md
      - Dashboard & Key Views: navigating/dashboard.md
  - Administration:
      - Overview: administration/index.md
      - Users, Roles, and Access: administration/users-access.md
      - Settings, Notifications, and Email: administration/settings-notifications.md
      - Audit Log: administration/audit-log.md
  - Operations:
      - Overview: operations/index.md
      - Production Deployment & Hardening: operations/deployment.md
      - Upgrading LicenseTrack: operations/upgrade.md
      - Native Linux Upgrades: operations/native-upgrade.md
      - Native Linux Removal: operations/native-uninstall.md
      - Operations Runbook: operations/runbook.md
      - Backup & Restore: operations/backup-restore.md
  - Advanced:
      - Integrations & Official Extensions: advanced/index.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true

plugins:
  - search
